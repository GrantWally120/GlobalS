# One-off: publish the orbital data that the last "Check CelesTrak data" run already downloaded
# to the data branch, WITHOUT contacting CelesTrak again (it is reused under the relay's 2-hour
# rule). Needed once because the first Publish run's runner was refused by CelesTrak.
# Remove this file after it has run.
name: Seed data branch (one-off)

on:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/seed-data.yml'

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Restore the last check's data
        uses: actions/cache/restore@v5
        with:
          path: .data-check
          key: data-check-none
          restore-keys: data-check-
      - name: Make sure nothing would be downloaded again
        run: |
          node -e '
            const m = require("./.data-check/manifest.json");
            const old = Object.entries(m.groups).filter(([, g]) => !(Date.now() - Date.parse(g.attemptedAt) < 110 * 60e3));
            if (old.length) { console.log(`::error::Cached data too old to reuse: ${old.map(([k]) => k).join(", ")}`); process.exit(1); }
            console.log(`${m.counts.objects} objects, fetched ${m.groups.active.fetchedAt}`);'
      - name: Build the data files (reusing, no CelesTrak contact)
        run: node tools/fetch-celestrak.mjs --out _data --previous .data-check
      - name: Refuse to publish a near-empty catalogue
        run: |
          node -e '
            const m = require("./_data/manifest.json");
            const contacted = Object.entries(m.groups).filter(([, g]) => g.status !== "reused");
            if (contacted.length) { console.log(`::error::Unexpected statuses: ${JSON.stringify(contacted)}`); process.exit(1); }
            if (!(m.counts?.objects >= 1000)) { console.log(`::error::Only ${m.counts?.objects ?? 0} objects`); process.exit(1); }
            console.log(`${m.counts.objects} objects, version ${m.version}`);'
      - name: Publish to the data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan data-publish
          git rm -rq --cached .
          cp _data/manifest.json _data/catalog.json _data/groups.json .
          cp .github/data-branch-README.md README.md
          git add manifest.json catalog.json groups.json README.md
          git commit -q -m "Orbital data from CelesTrak, $(node -p 'require("./_data/manifest.json").generatedAt')"
          git push --force origin HEAD:refs/heads/data
